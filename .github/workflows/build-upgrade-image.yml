name: build-upgrade-image

# Builds and publishes the k3s-upgrade-void image (linux/amd64 + linux/arm64)
# to ghcr.io/brdelphus/k3s-upgrade-void, tagged with the target k3s version and latest.
#
# Trigger manually with the target k3s release, e.g.:
#   gh workflow run build-upgrade-image.yml -f version=v1.36.5-k3s1
# or via the Actions tab → "Run workflow" → version input.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target k3s release version (e.g. v1.36.4-k3s1)'
        required: true
        default: 'v1.36.4-k3s1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: brdelphus
          # PAT / OAuth token with write:packages (GITHUB_TOKEN is read-only for
          # user-namespace packages). Set via: gh secret set GHCR_TOKEN --body "$(gh auth token)"
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upgrade
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/brdelphus/k3s-upgrade-void:${{ inputs.version }}
            ghcr.io/brdelphus/k3s-upgrade-void:latest
          build-args: |
            K3S_VERSION=${{ inputs.version }}
