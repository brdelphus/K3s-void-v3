name: Build k3s-upgrade-void image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'K3s version (e.g. v1.36.5-k3s1). Leave empty to build the latest stable release'
        required: false
        default: ''
  schedule:
    - cron: '0 */6 * * *' # every 6h — picks up new k3s releases automatically

env:
  IMAGE: ghcr.io/brdelphus/k3s-upgrade-void
  KEEP: 4 # number of version tags to keep; older ones are pruned

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GITHUB_TOKEN (not the PAT): packages pushed with it inherit the
          # repository visibility, so a public repo yields a public package.
          # A PAT-pushed package is born private and the REST API cannot flip
          # container packages to public (PATCH /user/packages/... -> 404).
          # The prune step still uses GHCR_TOKEN, which carries delete:packages.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve K3s version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            # Authenticated on purpose: the anonymous limit is 60 req/h per IP
            # and Actions runners share IPs, so this intermittently resolved to
            # "null" and tried to build rancher/k3s-upgrade:null.
            VERSION=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/k3s-io/k3s/releases/latest" \
              | jq -r '.tag_name // empty')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::could not resolve k3s version from the GitHub API"
            exit 1
          fi
          TAG=${VERSION/+/-}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Check if image already exists
        id: check
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PKG=$(basename "$IMAGE")
          # GHCR API instead of `docker manifest inspect`: the CLI check silently
          # reported "exists=true" for tags that were never pushed, so the cron
          # skipped real releases (v1.37.2 sat unbuilt for a day).
          if gh api "user/packages/container/$PKG/versions" --paginate \
               --jq '.[].metadata.container.tags[]?' 2>/dev/null | grep -qx "$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.check.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: ./upgrade
          file: ./upgrade/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          # CRITICAL: without this the Dockerfile falls back to its ARG default
          # (v1.36.4-k3s1) and every image ships a stale /opt/k3s binary — the
          # upgrade job then aborts with "Current k3s version ... is higher than".
          build-args: |
            K3S_VERSION=${{ steps.version.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest

      - name: Notify Telegram (new image published)
        if: steps.check.outputs.exists == 'false'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          MSG="🚀 Nova imagem k3s-upgrade-void <b>${TAG}</b> publicada (amd64 + arm64) — o SUC vai rolar o cluster sozinho"
          curl -s -o /dev/null -w "telegram: HTTP %{http_code}\n" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "parse_mode=HTML" \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage"

      - name: Prune old versions (keep newest ${{ env.KEEP }})
        env:
          GH_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          set -euo pipefail
          PKG=$(basename "$IMAGE")
          gh api "user/packages/container/$PKG/versions" --paginate > /tmp/versions.json
          jq -c --argjson keep "$KEEP" '
            [ .[]
              | select((.metadata.container.tags // []) | length > 0)
              | select(any(.metadata.container.tags[]; test("^v[0-9]+\\.[0-9]+\\.[0-9]+-k3s[0-9]+$")))
            ]
            | sort_by(.created_at)
            | reverse
            | .[$keep:] | .[]
          ' /tmp/versions.json > /tmp/prune.json
          COUNT=$(wc -l < /tmp/prune.json)
          echo "Pruning $COUNT old version(s)..."
          while read -r v; do
            ID=$(echo "$v" | jq -r .id)
            echo "  deleting version $ID"
            gh api -X DELETE "user/packages/container/$PKG/versions/$ID"
          done < /tmp/prune.json
          echo "Done. Keeping the $KEEP newest version tag(s)."
